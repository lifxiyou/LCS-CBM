# extends
extends: configs/default.yaml
# general configs
exp_name: wbc_crl_moe
# model configs
model:
  arch: crl
  backbone: resnet34
  n_concepts: 24
  l1: 256
  l2: 256
  use_not: true
  use_skip: true
  temperature: 1
  l2_weight: 5.0e-6
  logic_weight: 2   # 👈 新增逻辑损失权重
  num_experts: 5 
  gate_topk: 1           #没有用到现在，topk选择的，现在是softmax + top1
  gate_lb_weight: 1e-4     # 负载均衡 loss 权重（防止只用一个专家）

# don not use
  concept_warmup_epochs: 5
  gate_ent_weight: 0.01  # 熵正则权重（训练初期防塌陷/鼓励探索）
# data configs
data:
  data_dir: /data/fanli/workspace/Datasets/PBC
  dataset: wbcatt
  batch_size: 64
  img_size: 224
  img_mean: [0.485, 0.456, 0.406]
  img_std: [0.229, 0.224, 0.225]
  n_concepts: 24
  n_classes: 5
  process_dicts: {"label": {"Basophil": "0", "Eosinophil": "1", "Lymphocyte": "2", "Monocyte": "3", "Neutrophil": "4"}, "binarys": ["big cell size", "round cell shape", "high nuclear cytoplasmic ratio", "densely chromatin density", "clear cytoplasm texture", "yes cytoplasm vacuole", "yes granularity"]}
# opt configs
opt:
  optimizer: adamw
  lr: 5.0e-4
  max_epochs: 300
