# configs/skin.yaml
# general configs
project_name: skin_rrl
# extends
extends: configs/default.yaml
# general configs
exp_name: skin_crl_moe_Visualization

# model configs
model:
  arch: skin_crl
  backbone: resnet34
  l1: 256
  l2: 256
  use_not: false
  use_skip: false
  temperature: 1
  l2_weight: 5.0e-6
  logic_weight: 3    # 逻辑损失权重
  num_experts: 5      # MoE 专家数
  gate_lb_weight: 1e-4 # 负载均衡 loss 权重

# data configs
data: 
  data_dir: /data/fanli/workspace/Datasets/fitzpatrick17k
  dataset: skincon
  batch_size: 64
  img_size: 224
  img_mean: [0.485, 0.456, 0.406]
  img_std: [0.229, 0.224, 0.225]
  n_concepts: 48
  n_classes: 2
  fold: 0

# opt configs
opt:
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 0.01
  max_epochs: 300


