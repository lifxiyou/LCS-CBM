# Fitzpatrick17k + CRL MoE（gate_epoch 曲线：max_density / l1_gap）
extends: configs/default.yaml

project_name: f17k_rrl
exp_name: f17k_crl_moe

model:
  arch: crl
  backbone: resnet34
  l1: 256
  l2: 256
  use_not: true
  use_skip: true
  temperature: 1
  l2_weight: 5.0e-6
  logic_weight: 0.5
  num_experts: 9
  gate_lb_weight: 0.01

data:
  data_dir: /data/fanli/workspace/Datasets/fitzpatrick17k
  dataset: skincon
  batch_size: 64
  img_size: 224
  img_mean: [0.485, 0.456, 0.406]
  img_std: [0.229, 0.224, 0.225]
  n_concepts: 48
  n_classes: 2
  fold: 0

opt:
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 0.01
  max_epochs: 300
